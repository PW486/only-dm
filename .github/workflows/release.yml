name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Validate tag and version files
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          node scripts/set-version.mjs --check "$tag"

      - name: Ensure the tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi

  prepare:
    name: Prepare draft release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create or reuse draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG already exists and is not a draft." >&2
              exit 1
            fi
            echo "Reusing draft release $TAG ($release_id)"
          else
            prerelease_args=()
            if [[ "$TAG" == *-* ]]; then
              prerelease_args+=(--prerelease)
            fi

            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "OnlyDM $TAG" \
              --generate-notes \
              "${prerelease_args[@]}"
            release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
            echo "Created draft release $TAG ($release_id)"
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            platform: macos-latest
            args: "--target universal-apple-darwin --config src-tauri/tauri.release.conf.json"
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: "--config src-tauri/tauri.release.conf.json"
          - name: Windows (x64)
            platform: windows-latest
            args: "--config src-tauri/tauri.release.conf.json"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node - <<'NODE'
          const key = (process.env.TAURI_SIGNING_PRIVATE_KEY || "").trim();
          if (!key) {
            console.error("TAURI_SIGNING_PRIVATE_KEY is not configured.");
            process.exit(1);
          }
          const decoded = Buffer.from(key, "base64").toString("utf8");
          if (!decoded.startsWith("untrusted comment:")) {
            console.error(
              "TAURI_SIGNING_PRIVATE_KEY must be the base64-encoded key content (the contents of the .key file), not a file path.",
            );
            process.exit(1);
          }
          NODE

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: OnlyDM ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-meta
          gh release download "$TAG" --pattern latest.json --dir release-meta

      - name: Validate release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$assets"

          for pattern in '\.dmg$' '\.app\.tar\.gz$' '-setup\.exe$' '\.msi$' '\.AppImage$' '^latest\.json$'; do
            if ! grep -Eq -- "$pattern" <<< "$assets"; then
              echo "Missing release asset matching: $pattern" >&2
              exit 1
            fi
          done

          jq -e '
            .platforms["darwin-aarch64"] and
            .platforms["darwin-x86_64"] and
            .platforms["windows-x86_64"] and
            .platforms["linux-x86_64"] and
            ([.platforms[] | select(.url == "" or .signature == "")] | length == 0)
          ' release-meta/latest.json

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi

          {
            echo "## Released $TAG"
            echo
            gh release view "$TAG" --json url,assets \
              --jq '"Release: " + .url, "", "Assets:", (.assets[].name | "- " + .)'
          } >> "$GITHUB_STEP_SUMMARY"
