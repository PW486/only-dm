[package]
name = "only-dm"
version = "0.1.2"
description = "OnlyDM is a lightweight desktop direct message client for Instagram"
authors = ["you"]
edition = "2021"

[lib]
name = "only_dm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
url = "2"
