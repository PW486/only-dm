[package]
name = "only-dm"
version = "0.2.9"
description = "OnlyDM is a lightweight desktop direct message client for Instagram"
authors = ["you"]
edition = "2021"

[lib]
name = "only_dm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSAttributedString",
    "NSBitmapImageRep",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSFont",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSText",
    "NSTextAttachment",
    "NSTextField",
    "NSTextStorage",
    "NSTextView",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSObject",
    "NSRange",
    "NSString",
    "NSURL",
    "objc2-core-foundation",
] }
